[package]
name = "p1-module-write-stdin"
description = "The Codex `write_stdin` tool as a component: polls the session a Codex `exec_command` left running, over the host's job registry and output store (ADR-0218)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-exec-command-guest = { path = "../../crates/p1-exec-command-guest" }
serde_json = "1"

# The frozen package manifest (docs/design/modules/package.md): the session's jobs, the store
# an ended job's output lands in, the clock for the wall time, and `random` for the chunk id.
[package.metadata.p1-module]
name = "p1/write-stdin"
kind = "tool"
world = "p1:module/tool@1.2.0"
protocol = "1.0"
capabilities = ["clock", "random", "tool-outputs", "process-jobs"]
variant = "codex"
