[package]
name = "p1-module-glob-github"
description = "Find GitHub repository files by glob"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib"]
[lints]
workspace = true
[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-bindings-github = { path = "../p1-bindings-github" }
[package.metadata.p1-module]
name = "p1/glob-github"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["github-api"]
variant = "github"
