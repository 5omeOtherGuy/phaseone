[package]
name = "p1-module-channel-fixture"
description = "Spike: the fixture plugin over the generic channel (p1:channel/plugin)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No [package.metadata.p1-module]: scripts/build-modules.sh skips this package; the spike's
# own crates/p1-channel-spike/build-guest.sh builds it.

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
# A manifest that names a capability the host's catalog does not have (the E3 load refusal).
unknown-capability = []

[dependencies]
p1-bindings-channel = { path = "../p1-bindings-channel" }
serde_json = "1"
