# The frozen package manifest (docs/design/modules/package.md): `p1/todo`'s one grant.
[package.metadata.p1-module]
name = "p1/update-plan"
kind = "tool"
world = "p1:module/tool@1.2.0"
protocol = "1.0"
capabilities = ["control"]
variant = "codex"
