[package]
name = "p1-module-read"
description = "The p1 `read` tool as a component: the guest behaviour of p1-read-guest over the host's workspace and snapshot capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
# The guest behaviour lives with the native adapter it is tested through (decision S0-R3,
# docs/design/modules/package.md "Shared guest logic"), so both hosts run the same source.
p1-read-guest = { path = "../../crates/p1-tool-read/guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The frozen package manifest (docs/design/modules/package.md). `read` is granted the read side
# of the workspace, the observation it records after a successful read, and cooperative
# cancellation; never `workspace-mutation` (ADR-0071, S1.8).
[package.metadata.p1-module]
name = "p1/read"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["control", "workspace", "snapshot"]
variant = "claude"
