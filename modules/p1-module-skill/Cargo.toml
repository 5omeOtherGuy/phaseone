[package]
name = "p1-module-skill"
description = "Skill loading over the host's frozen prompt-data source"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-tool-skill = { path = "../../crates/p1-tool-skill" }
p1-contracts = { path = "../../crates/p1-contracts" }
serde_json = "1"

[package.metadata.p1-module]
name = "p1/skill"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["skills"]
variant = "default"
