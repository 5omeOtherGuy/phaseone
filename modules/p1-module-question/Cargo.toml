[package]
name = "p1-module-question"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib"]
[lints]
workspace = true
[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-question-guest = { path = "../../crates/p1-tool-question/guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[package.metadata.p1-module]
name = "p1/ask-user-question"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["user-questions"]
variant = "claude"
