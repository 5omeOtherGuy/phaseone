[package]
name = "p1-module-read-output"
description = "The p1 `read_output` tool as a component: the guest behaviour of p1-read-output-guest over the host's tool-outputs capability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
# The guest behaviour lives with the native adapter it is tested through (decision S0-R3,
# docs/design/modules/package.md "Shared guest logic"), so both hosts run the same source.
p1-read-output-guest = { path = "../../crates/p1-tool-read-output/guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The frozen package manifest (docs/design/modules/package.md). `read_output` is granted the
# host's store of what commands printed (`tool-outputs`, ADR-0109 item 6) and nothing else: it
# reads no workspace file, runs no command and has nothing to cancel.
[package.metadata.p1-module]
name = "p1/read-output"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["tool-outputs"]
variant = "claude"
