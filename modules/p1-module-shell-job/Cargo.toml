[package]
name = "p1-module-shell-job"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib"]
[lints]
workspace = true
[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-shell-job-guest = { path = "../../crates/p1-tool-shell-job/guest" }
