[package]
name = "p1-module-task"
description = "Task agent tool component over the scoped worker service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.p1-module]
name = "p1/task"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["control", "workers-start", "workers-observe"]
variant = "default"
