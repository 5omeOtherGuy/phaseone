[package]
name = "p1-module-request-user-input"
description = "The Codex `request_user_input` tool as a component over the host's user-questions capability (ADR-0218)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-question-guest = { path = "../../crates/p1-tool-question/guest" }
p1-request-user-input-guest = { path = "../../crates/p1-request-user-input-guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The frozen package manifest (docs/design/modules/package.md): the one grant
# `p1/ask-user-question` holds (ADR-0116).
[package.metadata.p1-module]
name = "p1/request-user-input"
kind = "tool"
world = "p1:module/tool@1.2.0"
protocol = "1.0"
capabilities = ["user-questions"]
variant = "codex"
