[package]
name = "p1-module-write"
description = "The p1/write tool component: atomic create-or-replace of one workspace file over the workspace capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
# The shared guest logic (S0-R3): the native p1-tool-write runs the same code.
p1-tool-write-logic = { path = "../../crates/p1-tool-write/logic" }

# The frozen package manifest (docs/design/modules/package.md). `scripts/build-modules.sh`
# reads these fields, checks them and copies them into the built module's manifest.
[package.metadata.p1-module]
name = "p1/write"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["control", "workspace", "snapshot", "workspace-mutation"]
# The loader builds the `ToolIdentity` from this field (package.md). The write tool's
# model-facing face is the Claude family (the `logic::NAME`/`DESCRIPTION` this package
# ships), so the module carries the variant the native `WriteTool` defaults to rather than
# the fixture's placeholder `default`; U-write.2 pins it when the loader builds the identity.
variant = "claude"
