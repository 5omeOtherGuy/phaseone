[package]
name = "p1-module-channel-shell"
description = "Spike: p1-shell-guest bound to the generic channel (p1:channel/plugin) instead of the tool world"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No [package.metadata.p1-module]: scripts/build-modules.sh skips this package; the spike's
# own crates/p1-channel-spike/build-guest.sh builds it.

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-channel = { path = "../p1-bindings-channel" }
p1-shell-guest = { path = "../../crates/p1-tool-shell/guest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
