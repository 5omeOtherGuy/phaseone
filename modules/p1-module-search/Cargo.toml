[package]
name = "p1-module-search"
description = "The search tool module: regex content and file search over the workspace, through the workspace capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
# The guest logic shared with the native tool (S0-R3), so both run the same code.
p1-tool-search-logic = { path = "../../crates/p1-tool-search/logic" }

# The frozen package manifest (docs/design/modules/package.md). `scripts/build-modules.sh`
# reads these fields, checks them and copies them into the built module's manifest.
[package.metadata.p1-module]
name = "p1/search"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
# No `snapshot` and no `workspace-mutation` (docs/design/modules/workspace-mutation.md, the
# per-tool table): a search reads without recording an observation and never takes the
# write gate, so it can never give an agent edit permission.
capabilities = ["control", "workspace"]
variant = "default"
