[package]
name = "p1-module-workflow-status"
description = "The workflow_status tool member as a guest component: reads a workflow run's status through workflows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

# serde and serde_json are the guest dependencies D-XO-8 allows, at the versions the root
# Cargo.lock pins; they keep the inputs, errors and texts the native crate's own.
[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The frozen package manifest (docs/design/modules/package.md). `scripts/build-modules.sh`
# reads these fields, checks them and copies them into the built module's manifest.
[package.metadata.p1-module]
name = "p1/workflow-status"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["control", "workflows"]
variant = "default"
