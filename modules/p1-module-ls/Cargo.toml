[package]
name = "p1-module-ls"
description = "Bounded ls over the host directory-listing capability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-tool-ls = { path = "../../crates/p1-tool-ls" }
serde_json = "1"

[package.metadata.p1-module]
name = "p1/ls"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
# WIT imports workspace's fs-error type alongside the listing operation.
capabilities = ["workspace", "directory-listing"]
variant = "claude"
