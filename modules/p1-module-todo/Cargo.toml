[package]
name = "p1-module-todo"
description = "Agent-authored to-do list component"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
p1-bindings-tool = { path = "../p1-bindings-tool" }
p1-todo-guest = { path = "../../crates/p1-tool-todo/guest" }
serde_json = "1"

[package.metadata.p1-module]
name = "p1/todo"
kind = "tool"
world = "p1:module/tool@1.0.0"
protocol = "1.0"
capabilities = ["control"]
variant = "default"
