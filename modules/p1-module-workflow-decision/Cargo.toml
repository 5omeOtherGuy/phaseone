[package]
name = "p1-module-workflow-decision"
description = "A workflow's step decisions as a guest component: plan-step and accept-step over the native crate's own decision code"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

# serde and serde_json are the guest dependencies D-XO-8 allows, at the versions the root
# Cargo.lock pins; the decision code and its contract types are compiled from
# crates/p1-workflow by path (src/lib.rs), so they need nothing else.
[dependencies]
p1-bindings-workflow-decision = { path = "../p1-bindings-workflow-decision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The frozen package manifest (docs/design/modules/package.md). `scripts/build-modules.sh`
# reads these fields, checks them and copies them into the built module's manifest.
[package.metadata.p1-module]
name = "p1/workflow-decision"
kind = "workflow-decision"
world = "p1:module/workflow-decision@1.0.0"
protocol = "1.0"
capabilities = ["control", "clock"]
variant = "default"
