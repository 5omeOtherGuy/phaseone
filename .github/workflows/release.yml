name: release

# Once a day, publish what main's newest green commit built — a user installs or updates
# from the release, never from a checkout (ADR-0065) — and keep the newest releases only
# (ADR-0216). This is the only place that builds in release profile (AGENTS.md).
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  choose:
    # The newest commit whose gate ran green for a push to main; a pull-request gate never
    # publishes. A day without a new green commit finds its release already published, and
    # the release job is skipped. A partial publication is repaired by re-running the failed
    # release job, which keeps this job's choice.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      published: ${{ steps.target.outputs.published }}
    steps:
      - name: Choose the commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -z "$sha" ]; then
            echo "no green gate for a push to main" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          tag="main-${sha:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishing $tag"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: choose
    if: needs.choose.outputs.published != 'true'
    runs-on: ubuntu-latest
    # A release build links the whole tree with thin LTO and a cold cache; the gate's 30 minutes
    # cover a debug build AND the tests, so this is generous, not tight.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.choose.outputs.sha }}

      # An exact toolchain, never the rolling `stable`: scripts/release-manifest.py embeds
      # the rustc/cargo versions in p1-share.tar.gz, so a rerun of a complete release after
      # stable advances would otherwise rebuild different bytes and fail the byte-identical
      # comparison in "Publish the release" instead of being the documented no-op.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          # The guest target the module build compiles for (WASM_TARGET in
          # modules/toolchain.pins: D-XO-4 on S0-Q9, wasm32-unknown-unknown componentized
          # with wasm-tools, never wasm32-wasip2).
          targets: wasm32-unknown-unknown

      - name: Read the wasm-tools pin
        run: echo "WASM_TOOLS_VERSION=$(sed -n 's/^WASM_TOOLS=//p' modules/toolchain.pins)" >> "$GITHUB_ENV"

      - name: Install wasm-tools (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
            connectors/target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-

      - name: Identify the commit
        id: tag
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=12 HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=main-$sha" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%F)" >> "$GITHUB_OUTPUT"

      # A release publishes one composition (ADR-0217): the shipped catalog roots of
      # catalog-roots.txt (the repository root and each connector, with the connectors' module
      # packages, ADR-0214) and, until unit 6 of #924, the owner pack. The binary anchors exactly
      # the roots its share packs (ADR-0196): the list plus packs/owner, in that order.
      - name: Build p1
        env:
          P1_GIT_SHA: ${{ steps.tag.outputs.sha }}
          P1_BUILD_DATE: ${{ steps.tag.outputs.date }}
        run: |
          set -euo pipefail
          P1_CATALOG_ROOTS="$(grep -v -e '^#' -e '^$' catalog-roots.txt | paste -sd ':'):packs/owner"
          export P1_CATALOG_ROOTS
          cargo build --release --locked -p p1-host
          install -m 0755 target/release/p1 "$RUNNER_TEMP/p1"

      - name: Build the module packages
        run: scripts/build-modules.sh --all

      - name: Package the assets
        run: |
          set -euo pipefail
          # One staging path builds each archive: the native binary plus the built module
          # packages, staged in a temporary directory and moved into place only when the whole
          # archive is complete. The share tree carries environments/, routes/, accounts/,
          # profiles/ and modules/ (manifest.json and packages/), never this checkout's own
          # modules/ sources; the roots are catalog-roots.txt and --parts adds the owner pack.
          scripts/stage-release.sh \
            --native "$RUNNER_TEMP/p1" \
            --out dist \
            --parts owner \
            --commit "${{ needs.choose.outputs.sha }}" \
            --tag "${{ steps.tag.outputs.tag }}"
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          target="${{ needs.choose.outputs.sha }}"
          required=(p1-linux-x86_64 p1-linux-x86_64.sha256 p1-share.tar.gz p1-share.tar.gz.sha256)

          tag_sha="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" \
            | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }')"
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$target" ]; then
            echo "tag $tag points to $tag_sha, expected $target" >&2
            exit 1
          fi

          release_exists=0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=1
          fi

          if [ "$release_exists" -eq 1 ]; then
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            complete=1
            for asset in "${required[@]}"; do
              grep -Fxq "$asset" <<<"$assets" || complete=0
            done
            if [ "$complete" -eq 1 ]; then
              compare="$(mktemp -d)"
              trap 'rm -rf -- "$compare"' EXIT
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$compare" \
                --pattern 'p1-linux-x86_64*' --pattern 'p1-share.tar.gz*'
              for asset in "${required[@]}"; do
                [ -f "$compare/$asset" ] || { echo "missing published $asset" >&2; exit 1; }
                cmp -s "dist/$asset" "$compare/$asset" || {
                  echo "published $asset differs from staged build; refusing no-op" >&2
                  exit 1
                }
              done
              echo "release $tag is complete and byte-identical — nothing to publish"
              exit 0
            fi
            # Repair a partial publication. --clobber also repairs an asset left from an
            # interrupted upload under the expected name.
            gh release upload "$tag" "${required[@]/#/dist/}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            echo "completed release $tag"
            exit 0
          fi

          # A tag without a release is incomplete, not a reason to skip publication.
          # Nothing else creates the tag: `gh release create --target` creates it at the
          # commit verified above, so no --verify-tag (which would abort on a tag that
          # does not exist yet and could never publish a first release).
          gh release create "$tag" \
            "${required[@]/#/dist/}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "p1 $tag" \
            --latest \
            --notes "Built from commit $target after a green gate on main. One composition (ADR-0217): p1-linux-x86_64 and p1-share.tar.gz, each with its .sha256. A share carries environments/, routes/, profiles/, accounts/ and modules/ with manifest.json and packages/. Install or update with: curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install.sh -o p1-install.sh && bash p1-install.sh"

  prune:
    # Keep the newest 30 releases and their tags (ADR-0216): p1-update and the pack-only gate
    # install the latest, and the rest is the rollback window of `install.sh --from-release`.
    # At most 100 deletions a run bound the requests one GITHUB_TOKEN makes; a backlog shrinks
    # by that many a run. A failed release keeps everything until a run publishes again.
    needs: [choose, release]
    if: >-
      always() && needs.choose.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete the releases beyond the newest 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("main-"))] | sort_by(.createdAt) | reverse
              | .[30:] | reverse | .[:100][] | .tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "deleted $tag"
            done
