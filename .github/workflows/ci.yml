# The connectors' checks on every push and pull request, and their release on a tag `v*`:
# fmt and clippy, the guest crates' unit tests and the host-side suites (natively, against
# p1's host crates at the phaseone revision Cargo.toml pins), every package built with the
# toolchain phaseone pins and held to p1's author conformance checks, and on a tag the packages,
# the catalog archive and SHA256SUMS published as a release, which phaseone's connectors.lock
# pins (scripts/fetch-connectors.py --pin <tag>).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            subscriptions/tests/target
          key: check-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path subscriptions/tests/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked -p p1-subscription-logins -p p1-subscription-usage
      - run: cargo clippy --manifest-path subscriptions/tests/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path subscriptions/tests/Cargo.toml --locked

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The Rust and the wasm-tools the SDK's phaseone checkout pins (modules/toolchain.pins).
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.259.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-
      # A tag v<version> versions every package; a branch build keeps each package's own version.
      - run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ./release.sh --version "${GITHUB_REF_NAME#v}" ;;
            *) ./release.sh ;;
          esac
      - run: ./conformance.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Connector packages for p1. Install one with \`p1 modules install <file>.p1pkg --confirm-origins\`; a distribution pins the release with phaseone's \`scripts/fetch-connectors.py --pin $GITHUB_REF_NAME\`. SHA256SUMS lists every asset." \
            dist/*.p1pkg dist/connectors-catalog.tar.gz dist/SHA256SUMS
