name: gate

# The gate (scripts/gate.sh) split into parallel jobs so a PR waits for the longest part, not
# the sum. `checks` runs scripts/gate.sh itself — every step, unchanged — except its one
# workspace test run, which the two test jobs run instead, split by package: together they
# are exactly `cargo test --workspace --locked --no-fail-fast`, and a new crate lands in test-workspace by
# default. The feature-off host acceptance runs too. The required check is the final job
# `gate`: green only when every needed job is green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR's newer push cancels its older run. Main runs never cancel each other (one group per
# commit): each main commit gets its own finished gate, and its cache save is not lost when the
# next merge lands minutes later.
concurrency:
  group: gate-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: never
  # No debug info on CI: nothing debugs a runner's binaries; compiles, links and caches shrink.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Docs-only fast path (ADR-0128): when every changed file is Markdown, the Rust jobs are
  # skipped and `light` (ADR check and script tests) is the whole gate, about a minute instead
  # of fifteen. Any other file, or a diff that cannot be read, runs the full gate.
  classify:
    name: classify (docs-only?)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # The compare API lists every changed file, with a rename's old name as previous_filename,
          # for up to 300 files; anything unreadable, larger or not a pull request or push runs the
          # full gate. No pipe between producer and grep: a SIGPIPE must not flip the result.
          docs_only=false
          files=""
          case "$EVENT" in
            pull_request|push)
              if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
                files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
                  --jq 'if (.files | length) >= 300 then "TOO-MANY" else .files[] | .filename, (.previous_filename // empty) end')" || files=""
              fi ;;
          esac
          if [ -n "$files" ]; then
            others="$(grep -vE '\.md$' <<<"$files" || true)"
            [ -n "$others" ] || docs_only=true
          fi
          printf 'changed files:\n%s\ndocs_only=%s\n' "$files" "$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  light:
    name: "light (docs-only gate: ADR check and script tests)"
    needs: [classify]
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Read the wasm-tools pin
        run: echo "WASM_TOOLS_VERSION=$(sed -n 's/^WASM_TOOLS=//p' modules/toolchain.pins)" >> "$GITHUB_ENV"
      - name: Install wasm-tools (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}
      - name: ADR check and script tests
        run: |
          set -euo pipefail
          python3 scripts/adr.py check
          for t in scripts/test_*.py; do python3 "$t" -q; done

  checks:
    name: checks (gate.sh without the workspace tests)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.docs_only != 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Read the wasm-tools pin
        run: echo "WASM_TOOLS_VERSION=$(sed -n 's/^WASM_TOOLS=//p' modules/toolchain.pins)" >> "$GITHUB_ENV"

      - name: Install wasm-tools (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}

      # Each job restores its own cache (its target differs), falling back to its own latest and
      # then to any gate cache. Only main saves (PR saves of multi-GB entries evicted main's).
      - name: Restore the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-checks-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-checks-
            cargo-${{ runner.os }}-

      - name: Provision sandbox
        run: bash scripts/ci-bwrap.sh
      - name: scripts/gate.sh (workspace tests handed to the test jobs)
        run: |
          set -o pipefail
          export PATH="$PWD/.github/ci:$PATH"
          scripts/gate.sh 2>&1 | tee /tmp/p1-gate-checks.log
          # gate.sh prints this message itself, so it is observable even though libtest
          # captures a passing suite's stderr and the marker stays hidden; the ci-bwrap probe
          # can pass while the gate probe fails.
          ! grep -F 'bubblewrap: unusable on this CI runner' /tmp/p1-gate-checks.log
          ! grep -F -e 'SKIP: bwrap unusable here' -e 'SKIP: no usable XDG_RUNTIME_DIR here' /tmp/p1-gate-checks.log

      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-checks-${{ hashFiles('**/Cargo.lock') }}

  test-modules-a:
    name: test (p1-module-tests, heaviest binaries)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.docs_only != 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Read the wasm-tools pin
        run: echo "WASM_TOOLS_VERSION=$(sed -n 's/^WASM_TOOLS=//p' modules/toolchain.pins)" >> "$GITHUB_ENV"

      - name: Install wasm-tools (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}

      # Each job restores its own cache (its target differs), falling back to its own latest and
      # then to any gate cache. Only main saves (PR saves of multi-GB entries evicted main's).
      - name: Restore the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-test-modules-a-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-test-modules-a-
            cargo-${{ runner.os }}-test-modules-
            cargo-${{ runner.os }}-

      - name: Build the modules the tests load (scripts/gate.sh's modules step)
        run: scripts/build-modules.sh --all
      - name: Build the p1 binary the release tests copy (fresh from this tree; P1_BIN, no nested cargo)
        run: |
          cargo build --locked -p p1-host --bin p1
          echo "P1_BIN=$(cargo metadata --no-deps --format-version 1 --locked | jq -r .target_directory)/debug/p1" >> "$GITHUB_ENV"
      - name: Provision sandbox
        run: bash scripts/ci-bwrap.sh
      - name: cargo test -p p1-module-tests (its heaviest test binaries)
        run: |
          set -o pipefail
          timeout --foreground 3600 cargo test --locked --no-fail-fast -p p1-module-tests --test installed_release --test provider_conformance -- --nocapture 2>&1 | tee /tmp/p1-installed-release-test.log
          ! grep -F 'SKIP: bwrap unusable here' /tmp/p1-installed-release-test.log

      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-test-modules-a-${{ hashFiles('**/Cargo.lock') }}

  test-modules-b:
    name: test (p1-module-tests, the rest)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.docs_only != 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Read the wasm-tools pin
        run: echo "WASM_TOOLS_VERSION=$(sed -n 's/^WASM_TOOLS=//p' modules/toolchain.pins)" >> "$GITHUB_ENV"

      - name: Install wasm-tools (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}

      # Each job restores its own cache (its target differs), falling back to its own latest and
      # then to any gate cache. Only main saves (PR saves of multi-GB entries evicted main's).
      - name: Restore the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-test-modules-b-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-test-modules-b-
            cargo-${{ runner.os }}-test-modules-
            cargo-${{ runner.os }}-

      - name: Build the modules the tests load (scripts/gate.sh's modules step)
        run: scripts/build-modules.sh --all
      # Every other target of p1-module-tests, read from cargo metadata so a new test file lands
      # here by default: the lib and bin unit tests, every integration test not in
      # test-modules-a, and the doctests. Together with test-modules-a this is exactly
      # `cargo test -p p1-module-tests`.
      - name: Build the p1 binary the release tests copy (fresh from this tree; P1_BIN, no nested cargo)
        run: |
          cargo build --locked -p p1-host --bin p1
          echo "P1_BIN=$(cargo metadata --no-deps --format-version 1 --locked | jq -r .target_directory)/debug/p1" >> "$GITHUB_ENV"
      - name: Provision sandbox
        run: bash scripts/ci-bwrap.sh
      - name: cargo test -p p1-module-tests (every other target)
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p1-modules-b.log
          heavy="installed_release provider_conformance"
          targets=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "p1-module-tests") | .targets[] | select(.kind | index("test")) | .name')
          # test-modules-a names these two; a rename must fail here, never drop a binary.
          for h in $heavy; do grep -qx "$h" <<<"$targets" || { echo "no test target $h in p1-module-tests" >&2; exit 1; }; done
          args=()
          for t in $targets; do
            case " $heavy " in *" $t "*) ;; *) args+=(--test "$t") ;; esac
          done
          [ "${#args[@]}" -gt 0 ] || { echo "no other test targets found" >&2; exit 1; }
          echo "test targets: ${args[*]}"
          timeout --foreground 3600 cargo test --locked --no-fail-fast -p p1-module-tests --lib --bins "${args[@]}" -- --nocapture 2>&1 | tee -a /tmp/p1-modules-b.log
          examples=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "p1-module-tests") | .targets[] | select(.kind | index("example")) | .name')
          for example in $examples; do
            timeout --foreground 3600 cargo test --locked --no-fail-fast -p p1-module-tests --example "$example" -- --nocapture 2>&1 | tee -a /tmp/p1-modules-b.log
          done
          timeout --foreground 3600 cargo test --locked --no-fail-fast -p p1-module-tests --doc
          ! grep -F 'SKIP: bwrap unusable here' /tmp/p1-modules-b.log

      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-test-modules-b-${{ hashFiles('**/Cargo.lock') }}

  test-workspace:
    name: test (workspace without p1-module-tests)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.docs_only != 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Read the wasm-tools pin
        run: echo "WASM_TOOLS_VERSION=$(sed -n 's/^WASM_TOOLS=//p' modules/toolchain.pins)" >> "$GITHUB_ENV"

      - name: Install wasm-tools (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}

      # Each job restores its own cache (its target differs), falling back to its own latest and
      # then to any gate cache. Only main saves (PR saves of multi-GB entries evicted main's).
      - name: Restore the cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-test-workspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-test-workspace-
            cargo-${{ runner.os }}-

      - name: Build the modules the tests load (scripts/gate.sh's modules step)
        run: scripts/build-modules.sh --all
      - name: Provision sandbox
        run: bash scripts/ci-bwrap.sh
      - name: cargo test --workspace --exclude p1-module-tests
        run: |
          set -o pipefail
          timeout --foreground 3600 cargo test --workspace --locked --no-fail-fast --exclude p1-module-tests -- --nocapture 2>&1 | tee /tmp/p1-workspace-test.log
          ! grep -F -e 'SKIP: bwrap unusable here' -e 'SKIP: no usable XDG_RUNTIME_DIR here' /tmp/p1-workspace-test.log
      - name: p1-host without delegation (scripts/gate.sh's feature-off acceptance)
        run: timeout --foreground 3600 cargo test --locked --no-fail-fast -p p1-host --no-default-features --test host without_delegation

      - name: Save the cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            modules/target
          key: cargo-${{ runner.os }}-test-workspace-${{ hashFiles('**/Cargo.lock') }}

  # The required status check. Fails unless every needed job succeeded: a failed, cancelled or
  # skipped job never passes (a skipped required check would otherwise count as passing), except
  # that on a docs-only change the Rust jobs are skipped by design and `light` stands for them.
  gate:
    name: gate
    if: always()
    needs: [classify, light, checks, test-modules-a, test-modules-b, test-workspace]
    runs-on: ubuntu-latest
    steps:
      - name: All gate jobs green
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if [ "$DOCS_ONLY" = true ]; then
            echo "docs-only change: light stands for the Rust jobs"
            echo "$NEEDS" | jq -e '.classify.result == "success" and .light.result == "success"' >/dev/null
          else
            echo "$NEEDS" | jq -e '.classify.result == "success" and .checks.result == "success" and ."test-modules-a".result == "success" and ."test-modules-b".result == "success" and ."test-workspace".result == "success"' >/dev/null
          fi
