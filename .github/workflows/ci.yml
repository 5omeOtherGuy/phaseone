name: gate

# One checks phase and two exhaustive test partitions, with balanced workspace shards; the bare
# build went with the `subscriptions` feature (ADR-0214). Cargo discovers every target;
# scripts/ci-tests.py schedules test binaries concurrently, then runs doctests and the
# feature-off host acceptance. The final gate requires every phase (ADR-0194).
#
# Every job runs on ubuntu-24.04, never ubuntu-latest: a runner OS move changes the glibc the
# released binary links against (release.yml pins the same image) and the AppArmor userns
# setting scripts/ci-bwrap.sh relaxes, so it lands as a deliberate pull request. Actions are
# pinned by commit with their version in a comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; a job raises only what it needs.
permissions:
  contents: read

# A PR's newer push cancels its older run. Main runs never cancel each other (one group per
# commit): each main commit gets its own finished gate, and its cache save is not lost when the
# next merge lands minutes later.
concurrency:
  group: gate-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # No debug info on CI: nothing debugs a runner's binaries; compiles, links and caches shrink.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Three fast paths skip the Rust jobs and leave `docs` (ADR check and secret scan) as the
  # gate (`fast`):
  # - docs-only (ADR-0128): every changed file is Markdown outside any `environments/`
  #   directory (the root's or a pack's), whose Markdown is runtime input (prompts);
  # - pack-only (#854): every changed file is under `packs/`. No Rust changed, so the released
  #   p1 checks the pack: `pack` installs the latest release and runs `p1 env check` and the
  #   pack's own tests;
  # - reuse (ADR-0192, pull requests only): the head's code is exactly the clean merge of an
  #   earlier green head of the same pull request with main, so only Markdown differs. A pull
  #   request that merges main to resolve a Markdown conflict, or to catch up, keeps its green.
  # Any other file, or anything that cannot be read, runs the full gate. Pushes to main always run
  # it: releases build from main's gate.
  classify:
    name: classify (docs-only or reuse?)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # checks: the reuse decision reads earlier `gate` check runs of the pull request.
    permissions:
      contents: read
      checks: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      pack_only: ${{ steps.classify.outputs.pack_only }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      fast: ${{ steps.classify.outputs.docs_only == 'true' || steps.classify.outputs.pack_only == 'true' || steps.reuse.outputs.reuse == 'true' }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The compare API lists every changed file, with a rename's old name as previous_filename,
          # for up to 300 files; anything unreadable, larger or not a pull request runs the full
          # gate. A push to main always does (ADR-0192): release.yml publishes the newest green
          # push gate, so every main commit it can choose has built and tested its own code.
          # No pipe between producer and grep: a SIGPIPE must not flip the result.
          docs_only=false
          pack_only=false
          files=""
          case "$EVENT" in
            pull_request)
              if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
                files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
                  --jq 'if (.files | length) >= 300 then "TOO-MANY" else .files[] | .filename, (.previous_filename // empty) end')" || files=""
              fi ;;
          esac
          if [ -n "$files" ]; then
            others="$(grep -vE '\.md$' <<<"$files" || true)$(grep -E '(^|/)environments/' <<<"$files" || true)"
            [ -n "$others" ] || docs_only=true
            # TOO-MANY has no `packs/` prefix, so it never counts as pack-only.
            outside="$(grep -vE '^packs/' <<<"$files" || true)"
            [ -n "$outside" ] || pack_only=true
          fi
          printf 'changed files:\n%s\ndocs_only=%s\npack_only=%s\n' "$files" "$docs_only" "$pack_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "pack_only=$pack_only" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && steps.classify.outputs.docs_only != 'true'
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: reuse
        if: github.event_name == 'pull_request' && steps.classify.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          # The decision runs main's copy of the script, so a pull request cannot change the rule
          # that skips its own gate. A failure here only loses the fast path: the full gate runs.
          reuse=false
          if git show "$BASE_REF:scripts/gate_reuse.py" > "$RUNNER_TEMP/gate_reuse.py" 2>/dev/null; then
            reuse="$(python3 "$RUNNER_TEMP/gate_reuse.py" --head "$HEAD" --base-ref "$BASE_REF" --repo "$GITHUB_REPOSITORY" | sed -n 's/^reuse=//p')" || reuse=false
          fi
          [ "$reuse" = true ] || reuse=false
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  # Docs-only gate: no toolchain, no cache, no build. A Markdown change cannot move any Rust or
  # script behaviour, so only the checks that read Markdown run: the ADR index and files, and the
  # secret scan (docs are where a pasted credential would land).
  docs:
    name: "docs (docs-only gate: ADR check and secret scan)"
    needs: [classify]
    if: needs.classify.outputs.fast == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ADR check and its tests
        run: |
          set -euo pipefail
          python3 scripts/adr.py check
          python3 scripts/test_adr.py -q
      - name: Secret scan
        run: scripts/secret-scan.sh

  # Pack-only gate (#854): no toolchain and no build. The latest release is the p1 the pack runs
  # on; it is published by hand (ADR-0218), so it can be older than main. The job checks the pull
  # request's pack layered over its own catalog (`P1_PACKS`, ADR-0201), and the pack's tests run
  # against it.
  pack:
    name: "pack (pack-only gate: p1 env check and the pack's tests on the released p1)"
    needs: [classify]
    if: needs.classify.outputs.pack_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "the latest release: $tag"
          scripts/install.sh --from-release "$tag" --prefix "$RUNNER_TEMP/p1"
      - name: p1 env check over the pack
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          "$RUNNER_TEMP/p1/bin/p1" env check --dir packs/owner
      - name: The pack's tests
        env:
          P1_BIN: ${{ runner.temp }}/p1/bin/p1
        run: |
          set -euo pipefail
          for suite in packs/owner/tests/test_*.py packs/owner/scripts/test_*.py; do
            python3 "$suite" -q
          done

  checks:
    name: checks
    runs-on: ubuntu-24.04
    needs: [classify]
    if: needs.classify.outputs.fast != 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate-setup
        with:
          partition: checks
      - name: Gate checks and release smoke
        run: |
          set -o pipefail
          scripts/gate.sh --checks 2>&1 | tee /tmp/p1-gate-checks.log
          ! grep -F 'bubblewrap: unusable on this CI runner' /tmp/p1-gate-checks.log
          ! grep -F -e 'SKIP: bwrap unusable here' -e 'SKIP: no usable XDG_RUNTIME_DIR here' /tmp/p1-gate-checks.log
      - uses: ./.github/actions/gate-cache-save
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          partition: checks

  tests:
    name: tests (${{ matrix.partition }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: [classify]
    if: needs.classify.outputs.fast != 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [workspace]
        shard: [1, 2, 3, 4]
        include:
          - partition: modules
            shard: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate-setup
        with:
          partition: ${{ matrix.partition }}
      - name: Build the modules the tests load
        run: scripts/build-modules.sh --all
      - name: Every test executable and doctest
        run: >-
          python3 scripts/ci-tests.py --partition "${{ matrix.partition }}"
          --shard "${{ matrix.shard }}" --shards "${{ matrix.partition == 'workspace' && 4 || 1 }}"
          --jobs "${{ matrix.partition == 'workspace' && 2 || 4 }}"
      - uses: ./.github/actions/gate-cache-save
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        with:
          partition: ${{ matrix.partition }}

  # The required status check. Fails unless every needed job succeeded: a failed, cancelled or
  # skipped job never passes (a skipped required check would otherwise count as passing), except
  # that on a fast path (docs-only, pack-only or reuse) the Rust jobs are skipped by design and
  # `docs` stands for them, with `pack` beside it on the pack-only path.
  gate:
    name: gate
    if: always()
    needs: [classify, docs, pack, checks, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All gate jobs green
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAST: ${{ needs.classify.outputs.fast }}
          PACK: ${{ needs.classify.outputs.pack_only }}
          REUSE: ${{ needs.classify.outputs.reuse }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if [ "$FAST" = true ]; then
            if [ "$PACK" = true ]; then
              echo "pack-only change: docs and pack stand for the Rust jobs"
              echo "$NEEDS" | jq -e '.pack.result == "success"' >/dev/null
            elif [ "$REUSE" = true ]; then
              echo "reuse: the code equals the clean merge of an earlier green head with main; docs stands for the Rust jobs"
            else
              echo "docs-only change: docs stands for the Rust jobs"
            fi
            echo "$NEEDS" | jq -e '.classify.result == "success" and .docs.result == "success"' >/dev/null
          else
            echo "$NEEDS" | jq -e '.classify.result == "success" and .checks.result == "success" and .tests.result == "success"' >/dev/null
          fi
