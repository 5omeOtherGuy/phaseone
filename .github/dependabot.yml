# Weekly dependency updates: minor and patch grouped into one pull request per ecosystem,
# majors one by one, each release a few days old before it is proposed. Every pull request
# runs the gate like any other. Dependabot raises a major only on a run where the group's
# pull request is not open (dependabot-core#14202, no configuration avoids it), so merge the
# grouped pull request once its gate is green and the majors follow on the next run.
version: 2
updates:
  - package-ecosystem: cargo
    # The three Cargo workspaces: the native root, the guest modules and the connectors.
    directories: ["/", "/modules", "/connectors"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    labels: [dependencies]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The bounded runtime set is pinned exactly in modules/toolchain.pins too, and
      # scripts/module-toolchain.sh --check holds the lockfiles to it: move both by hand.
      - dependency-name: "wasmtime"
      - dependency-name: "wit-bindgen"
      # The connectors name the module SDK by its git tag and build the sibling checkout's.
      - dependency-name: "p1-module-sdk"
      # Held on 0.12 (#954): every 0.13 TLS selection adds crates the workspace does not use
      # (rustls-platform-verifier and its tree, aws-lc-rs by default), which AGENTS.md leaves
      # to the owner. Patches of 0.12 still come through the group.
      - dependency-name: "reqwest"
        versions: [">= 0.13"]

  - package-ecosystem: github-actions
    # The workflows and the composite actions they call; pins are commits with a version comment.
    directories: ["/", "/.github/actions/gate-setup", "/.github/actions/gate-cache-save"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    labels: [dependencies]
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
