name: Gate setup
description: Pinned tools, partition cache and required sandbox for every gate job
inputs:
  partition:
    description: checks, workspace or modules; caches never cross partitions
    required: true
runs:
  using: composite
  steps:
    # The exact toolchain is the `toolchain` input (the action is pinned by commit, so its
    # ref cannot name the version); .agents/setup and scripts/test_release_publication.py read it.
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: 1.98.1
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
    - name: Read the wasm-tools pin
      shell: bash
      run: echo "WASM_TOOLS_VERSION=$(sed -n 's/^WASM_TOOLS=//p' modules/toolchain.pins)" >> "$GITHUB_ENV"
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          modules/target
          connectors/target
        key: gate-v2-${{ runner.os }}-${{ inputs.partition }}-${{ hashFiles('Cargo.lock', 'modules/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          gate-v2-${{ runner.os }}-${{ inputs.partition }}-${{ hashFiles('Cargo.lock', 'modules/Cargo.lock') }}-
          gate-v2-${{ runner.os }}-${{ inputs.partition }}-
          cargo-${{ runner.os }}-${{ inputs.partition == 'workspace' && 'test-workspace' || inputs.partition == 'modules' && 'test-modules-b' || 'checks' }}-${{ hashFiles('Cargo.lock', 'modules/Cargo.lock') }}
    - name: Provision sandbox
      shell: bash
      run: bash scripts/ci-bwrap.sh
