name: Feature request
description: A problem p1 should solve
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would solve it, if you have an idea. Alternatives you considered are welcome.
    validations:
      required: false
