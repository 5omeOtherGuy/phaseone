[package]
name = "p1-tool-shell"
description = "The p1 `shell` tool: one-shot bash execution with bounded output and process-group kill"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
# The native process service and sandbox this tool runs over, and serves to the component.
p1-module-runtime = { path = "../p1-module-runtime" }
p1-shell-guest = { path = "guest" }
p1-workspace = { path = "../p1-workspace" }

[dev-dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
