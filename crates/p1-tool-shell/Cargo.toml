[package]
name = "p1-tool-shell"
description = "The p1 `shell` tool: one-shot bash execution with bounded output and process-group kill"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-module-runtime = { path = "../p1-module-runtime" }
p1-shell-guest = { path = "guest" }
p1-workspace = { path = "../p1-workspace" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "process", "io-util", "time", "macros"] }
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
