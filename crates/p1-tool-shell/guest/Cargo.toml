[package]
name = "p1-shell-guest"
description = "The guest behaviour of the p1 `shell` tool: input, declaration, classification, output filters and result formatting, shared by the component and the native adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Pure computation only (programme decision D-XO-8): these four crates and nothing else, so
# the same code builds for the native adapter and for the `wasm32-unknown-unknown` component
# (docs/design/modules/package.md, "Shared guest logic", decision S0-R3).
[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The embedded declarative shell-output filters (`src/filter/data/*.toml`); parse-only, as the
# host's other TOML readers use it, so no crate is added to either lock file.
toml = { version = "0.8", default-features = false, features = ["parse"] }
