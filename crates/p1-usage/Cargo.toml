[package]
name = "p1-usage"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The usage probes of the subscription plans (ADR-0200): Claude, Codex, OpenCode Go, Kimi and
# GLM. Off => the bare build, where no route has a usage endpoint.
default = ["subscriptions"]
subscriptions = []

[dependencies]
p1-auth = { path = "../p1-auth", default-features = false }
p1-provider-http = { path = "../p1-provider-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures-util = "0.3"
time = "0.3"
unicode-width = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
