[package]
name = "p1-read-output-guest"
description = "The guest behaviour of the p1 `read_output` tool: input, declaration, description, paging requests, the page footer and the error texts, shared by the component and the native adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Pure computation only (programme decision D-XO-8): regex, serde and serde_json and nothing
# else, so the same code builds for the native adapter and for the `wasm32-unknown-unknown`
# component (docs/design/modules/package.md, "Shared guest logic", decision S0-R3). `regex`
# matches a search's `pattern` (#526).
[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
