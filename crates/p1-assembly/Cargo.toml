[package]
name = "p1-assembly"
description = "Environment files -> a validated ResolvedEnvironment plus the provider, tools, prompt and options one agent is built from"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-model-profile = { path = "../p1-model-profile" }
# Issue #142: `ToolServices` carries the assembling agent's ONE `MaskCounter`, so a
# tool factory that wraps its tool for masking (the module catalog factory) binds the
# turn's own counter, not a throwaway.
p1-redact = { path = "../p1-redact" }
p1-workspace = { path = "../p1-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
p1-testkit = { path = "../p1-testkit" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
