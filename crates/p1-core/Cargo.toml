[package]
name = "p1-core"
description = "The p1 agent core: one agent's request -> stream -> tool calls -> repeat loop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
futures-util = { version = "0.3", default-features = false }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[dev-dependencies]
p1-testkit = { path = "../p1-testkit" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "test-util"] }
