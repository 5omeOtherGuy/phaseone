[package]
name = "p1-tool-patch"
description = "The p1 `apply_patch` tool: validated, all-or-nothing V4A patches confined to the workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
# The logic the `p1/patch` component ships (S0-R3), so native and component run the same code.
p1-tool-patch-logic = { path = "logic" }
p1-workspace = { path = "../p1-workspace" }
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }
