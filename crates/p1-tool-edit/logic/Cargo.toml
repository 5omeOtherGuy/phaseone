[package]
name = "p1-tool-edit-logic"
description = "The target-independent logic of the p1 `edit` tool, shared by the native tool and its component (S0-R3)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# S0-R3 (docs/design/modules/package.md): std, serde (derive), serde_json and regex only, at
# the versions the root Cargo.lock pins, so the same crate builds natively and for the guest.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
