[package]
name = "p1-acp"
description = "Pure mapping between p1 contracts and ACP v1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "io-util", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
