[package]
name = "p1-provider-conformance"
description = "Shared conformance checks for p1 provider adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-provider-http = { path = "../p1-provider-http", features = ["testing"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "test-util", "macros"] }
serde_json = "1"
