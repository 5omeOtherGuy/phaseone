[package]
name = "p1-module-tests"
description = "Runtime spike and module execution-model tests over the built fixture component (test-only crate; nothing depends on it)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-module-runtime = { path = "../p1-module-runtime" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
p1-core = { path = "../p1-core" }
p1-redact = { path = "../p1-redact" }
# The transport-authority suite (S4.5) drives S4.2's broker over the scripted
# transport and the one real transport's redirect policy over a loopback socket.
p1-provider-http = { path = "../p1-provider-http", features = ["testing"] }
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
] }
p1-testkit = { path = "../p1-testkit" }
p1-workers = { path = "../p1-workers" }
# workflow_boundary.rs: the workflow substrate driven through its decision seam (S6.3).
p1-workflow = { path = "../p1-workflow" }
# policies.rs (S5.4): the policy components behind the native ask bridge, and the native
# context engine whose estimator builds the settings the component is configured with.
p1-host = { path = "../p1-host" }
p1-context = { path = "../p1-context" }
