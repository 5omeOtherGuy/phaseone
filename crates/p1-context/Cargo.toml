[package]
name = "p1-context"
description = "Context control: a summarizing ContextPolicy that works through the ordinary provider interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The native driver, `SummarizingContext` (ADR-0071). Without it only the I/O-free
# policy engine builds, which the context-policy component compiles for the wasm target.
default = ["native"]
native = ["dep:p1-redact", "dep:futures-util", "dep:tokio"]

[dependencies]
p1-contracts = { path = "../p1-contracts" }
# The summarizer's own output goes through the same credential-shape matcher the
# host wraps every tool in (issue #142).
p1-redact = { path = "../p1-redact", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio = { version = "1", default-features = false, features = ["macros"], optional = true }

[dev-dependencies]
p1-core = { path = "../p1-core" }
p1-journal = { path = "../p1-journal" }
p1-testkit = { path = "../p1-testkit" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "rt", "time", "test-util"] }
