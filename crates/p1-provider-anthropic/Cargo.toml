[package]
name = "p1-provider-anthropic"
description = "Claude subscription (OAuth) route of the Anthropic Messages API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The native provider: `AnthropicProvider` over the shared transport and drive loop
# (ADR-0071). Without it only the portable route, validation, request lowering and
# parser build, so a provider WebAssembly component reaches no socket, runtime or
# credential code.
default = ["native"]
native = ["p1-provider-http/native"]

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-model-profile = { path = "../p1-model-profile" }
p1-provider-http = { path = "../p1-provider-http", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
p1-provider-conformance = { path = "../p1-provider-conformance" }
p1-provider-http = { path = "../p1-provider-http", features = ["testing"] }
# Draining a streamed test body needs `StreamExt`; the crate is already in the
# workspace tree. The adapter itself owns no credential code any more.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time", "test-util"] }
