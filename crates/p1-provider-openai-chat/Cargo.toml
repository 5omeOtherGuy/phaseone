[package]
name = "p1-provider-openai-chat"
description = "Chat Completions subscription routes for OpenCode Go and Z.ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The native provider: `ChatProvider` over the shared transport and drive loop
# (ADR-0071). Without it only the portable route, validation, request lowering and
# parser build, so a provider WebAssembly component reaches no socket, runtime or
# credential code.
default = ["native", "subscriptions"]
native = ["p1-provider-http/native"]
# The OpenCode client identity (ADR-0200): its user-agent, `x-opencode-*` headers and
# generated session ids. Off => the bare build presents p1's own identity only.
subscriptions = []

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-model-profile = { path = "../p1-model-profile" }
p1-provider-http = { path = "../p1-provider-http", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
p1-provider-conformance = { path = "../p1-provider-conformance" }
p1-provider-http = { path = "../p1-provider-http", features = ["testing"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time", "test-util"] }

# The OpenCode client identity's suite.
[[test]]
name = "client_identity"
required-features = ["subscriptions"]
