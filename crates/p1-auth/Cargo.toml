[package]
name = "p1-auth"
description = "Credential lookup for a route: the env → p1 store → borrowed-login chain (ADR-0040)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-provider-http = { path = "../p1-provider-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Draining the streaming body of an OAuth token-refresh response needs `StreamExt`;
# the crate is already in the workspace tree.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The OAuth token refresh is bounded like a provider read (issue #164, ADR-0069's
# constants); the crate is already in the workspace tree.
# `rt`: a started token rotation runs to its write-back even when the caller is
# cancelled (issue #484).
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
# Credential files are opened, locked and replaced relative to a pinned directory
# handle (`openat`/`renameat`, no symlink following, issue #484); the crate is
# already in the workspace tree (p1-workspace).
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
p1-provider-http = { path = "../p1-provider-http", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time", "test-util"] }
