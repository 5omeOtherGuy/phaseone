[package]
name = "p1-tui"
description = "The p1 terminal UI: a pure state machine and cell renderer per docs/design/tui/SPEC.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
crossterm = "0.29"
ratatui = "0.30"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

[dev-dependencies]
ratatui = { version = "0.30", features = ["unstable"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
