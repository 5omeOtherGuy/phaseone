[package]
name = "p1-tui"
description = "The p1 terminal UI: a pure state machine and cell renderer per docs/design/tui/SPEC.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
crossterm = "0.29"
ratatui = "0.30"
# `time`: the sink's epoch is a tokio `Instant` (runtime.rs), so the TUI's one
# clock follows the runtime clock — a paused-time test drives every screen clock.
tokio = { version = "1", default-features = false, features = ["sync", "macros", "time"] }
# Display-cell width for layout math (chars are not cells: CJK/emoji are wide).
# Already in the tree as ratatui's own dependency — no new vendoring.
unicode-width = "0.2"

[dev-dependencies]
# The SLAB snapshot oracle reads docs/design/tui/slab/grids.json (ADR-0056).
serde_json = "1"
ratatui = { version = "0.30", features = ["unstable"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
