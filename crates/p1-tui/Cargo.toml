[package]
name = "p1-tui"
description = "The p1 terminal UI: a pure state machine and cell renderer per docs/design/tui/SPEC.md"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
crossterm = "0.29"
ratatui = "0.30"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
# Display-cell width for layout math (chars are not cells: CJK/emoji are wide).
# Already in the tree as ratatui's own dependency — no new vendoring.
unicode-width = "0.2"
# Grapheme clusters for the composer's caret and deletions; also already in the
# tree as ratatui's own dependency.
unicode-segmentation = "1"
serde_json = "1"

[dev-dependencies]
ratatui = { version = "0.30", features = ["unstable"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
