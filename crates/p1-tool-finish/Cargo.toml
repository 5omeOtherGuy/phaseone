[package]
name = "p1-tool-finish"
description = "The p1 `finish` tool: an observable end-of-task act for unattended runs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
# The rules and texts the `p1/finish` component ships (decision S0-R3): this crate runs them
# natively, so its tests prove the component's code.
p1-finish-guest = { path = "guest" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
