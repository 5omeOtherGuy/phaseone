[package]
name = "p1-tool-read"
description = "The p1 `read` tool: line-numbered, offset/limit file reads confined to the workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
# The `workspace` and `snapshot` capability traits this crate's native services implement.
p1-module-runtime = { path = "../p1-module-runtime" }
p1-read-guest = { path = "guest" }
# The search tool's `workspace` service (`list-files`, `search`) beside this crate's read
# side, so one builder links every tool component of the release (S2).
p1-tool-search = { path = "../p1-tool-search" }
# The owned mutation service (`workspace-mutation`) the edit, write and patch components
# are linked with, over the same agent and the same read record (S2).
p1-tool-write = { path = "../p1-tool-write" }
p1-workspace = { path = "../p1-workspace" }
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
