[package]
name = "p1-tool-search"
description = "The p1 `grep` tool: regex content and file search confined to the workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
p1-tool-search-logic = { path = "logic" }
p1-workspace = { path = "../p1-workspace" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }
grep = "0.4"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
