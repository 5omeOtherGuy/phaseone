[package]
name = "p1-tool-search-logic"
description = "The target-independent logic of the p1 `grep` tool, shared by the native tool and its component (S0-R3)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# S0-R3 (docs/design/modules/package.md): std, serde (derive), serde_json and regex only, at
# the versions the root Cargo.lock pins, so the same crate builds natively and for the guest.
# The walk and the matching (`ignore`, `grep`) stay native: they run on the host behind
# `workspace.search` and `workspace.list-files`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
