[package]
name = "p1-workspace"
description = "Workspace path confinement, atomic writes, observed-file registry and output bounding for the p1 file tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
p1-contracts = { path = "../p1-contracts" }
thiserror = "2"
# Directory-relative file operations (openat, renameat, unlinkat) for the mutation side;
# std has no *at calls. Already in the lock as a transitive dependency.
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
tempfile = "3"
