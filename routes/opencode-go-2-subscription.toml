# The owner's SECOND OpenCode Go subscription (2026-09-20, when the first ran out of credit).
# Same endpoint, dialect and session header as `opencode-go-subscription`; a different ACCOUNT,
# therefore a different route id and origin (a session resumes only on the route that recorded
# it, ADR-0033). The key is not in any CLI login store: the operator supplies it through the
# environment variable (e.g. from ~/.config/keys/), p1 never reads that file itself.
# Owner rule (2026-09-20): this account serves DeepSeek V4.1 Flash ONLY — bind no other profile.
id           = "opencode-go-2-subscription"
origin_route = "openai-chat/opencode-go-2-subscription"
adapter      = "openai-chat"
endpoint     = "https://opencode.ai/zen/go/v1/chat/completions"

[credential]
# A reference, never a value: the environment variable first, then the two CLI logins
# that hold this subscription's key.
kind   = "api-key"
env    = "OPENCODE_GO_2_API_KEY"
borrow = []

[adapter_settings]
dialect        = "thinking-with-reasoning-alias"
session_header = "x-opencode-session"

# Only profiles the host ships a policy for; any other profile is refused.
[models."deepseek-v4.1-flash"]
wire_model = "deepseek-v4.1-flash"
