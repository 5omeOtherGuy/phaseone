# The owner's THIRD OpenCode Go subscription (2026-09-24): the account that serves work now.
# Same endpoint, dialect and session header as `opencode-go-subscription`; a different ACCOUNT,
# therefore a different route id: p1's store keeps one credential per route id (ADR-0061), and a
# separate origin keeps a recorded session's account meaningful. The key comes from p1's own store (`p1 login opencode-go-3-subscription`, which
# keys-sync runs from ~/.config/keys/opencode-go-3.key) or from OPENCODE_GO_3_API_KEY; no CLI
# login file is read (store_only).
# Owner rule (2026-09-20, carried to this account): an OpenCode Go account serves DeepSeek V4.1
# Flash ONLY — bind no other profile.
id           = "opencode-go-3-subscription"
origin_route = "openai-chat/opencode-go-3-subscription"
adapter      = "openai-chat"
endpoint     = "https://opencode.ai/zen/go/v1/chat/completions"

[credential]
# A reference, never a value. `store_only` (ADR-0061): the documented variable
# below and p1's own store, and no CLI login file is ever read.
kind       = "api-key"
env        = "OPENCODE_GO_3_API_KEY"
borrow     = []
store_only = true

[adapter_settings]
dialect        = "thinking-with-reasoning-alias"
session_header = "x-opencode-session"

# Only profiles the host ships a policy for; any other profile is refused.
[models."deepseek-v4.1-flash"]
wire_model = "deepseek-v4.1-flash"
