# How the OpenCode Go subscription is reached (ADR-0039 step 3, spec §1.2 of
# docs/design/routes-and-profiles.md). Everything the host used to hard-code for this
# route lives here. `user-agent` does NOT: it carries this crate's version, so it stays
# compiled in `p1_host::catalog` where `env!("CARGO_PKG_VERSION")` is available, and a
# route file cannot stale it. There are no other static headers on this route, so there
# is no `[headers]` table.
#
# COMPATIBILITY ALIAS (2026-09-24): the account this name has always reached is no longer the
# current primary — `opencode-go-3-subscription` is. This file is kept, unchanged (same id, same
# `OPENCODE_API_KEY`, same behaviour) with its own p1 store entry, so every environment, brief
# and stored session that names `opencode-go-subscription` keeps working. p1 has no alias
# mechanism in code: an alias is simply another route file, and this is one.
id           = "opencode-go-subscription"
origin_route = "openai-chat/opencode-go-subscription"
adapter      = "openai-chat"
endpoint     = "https://opencode.ai/zen/go/v1/chat/completions"

[credential]
# A reference, never a value. `store_only` (ADR-0061) keeps this route
# self-contained: the documented variable below and p1's own store, never the
# OpenCode or Pi CLI login files. Drop the field to restore the legacy
# borrow-the-CLI chain.
kind       = "api-key"
env        = "OPENCODE_API_KEY"
borrow     = []
store_only = true

[adapter_settings]
dialect        = "thinking-with-reasoning-alias"
session_header = "x-opencode-session"

# Only profiles the host ships a policy for; any other profile is refused.
[models."deepseek-v4.1-flash"]
wire_model = "deepseek-v4.1-flash"
