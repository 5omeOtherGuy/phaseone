# The public Anthropic Messages API, paid per token with an API key (ADR-0197): the route the
# core `default` environment uses, so p1 runs without any subscription. `dialect = "api-key"`
# sends the key as `x-api-key`, keeps the prompt-cache markers and sends neither the Claude
# Code identity block nor its OAuth betas. Every model bound below has a 1M-token window by
# default on this API, so the route asks for no context beta (docs.anthropic.com
# context-windows, fetched 2026-10-11).
id           = "anthropic"
origin_route = "anthropic-messages/anthropic"
adapter      = "anthropic-messages"
endpoint     = "https://api.anthropic.com"

# A reference, never a value: an implicit account (ADR-0139 §6) whose key is the documented
# variable, else `p1 login anthropic`.
[credential]
method     = "api-key"
env        = "ANTHROPIC_API_KEY"
store_only = true

[adapter_settings]
dialect           = "api-key"
credential_header = "x-api-key"

# The shipped Claude profiles; the Claude API serves each under its profile id.
[models."claude-fable-5"]
wire_model = "claude-fable-5"
[models."claude-opus-4-6"]
wire_model = "claude-opus-4-6"
[models."claude-opus-5"]
wire_model = "claude-opus-5"
[models."claude-opus-5-5"]
wire_model = "claude-opus-5-5"
[models."claude-sonnet-4-6"]
wire_model = "claude-sonnet-4-6"
[models."claude-sonnet-5"]
wire_model = "claude-sonnet-5"
