route   = "opencode-zen-2"
profile = "space-bunny-free"

[options]
reasoning_effort = "high"

# The OpenCode Zen free-tier gate accepts a request only when it declares tools
# named `bash` and `read`. The environment grants them (a provider owns no tool):
# `shell` is presented as `bash`, `read` as `read`. Evidence:
# docs/design/zen-client-identity-evidence.md.
[[tools]]
module = "read"
name   = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
name   = "bash"
[[tools]]
module = "finish"

# The model metadata states a 1,048,576-token context and a 524,288-token output limit. The
# second value is what leaves room for the next response, so it is the headroom; summarizing
# then starts below the remaining input wall (524,288). Keep a long recent tail for multi-file
# work. Operational values for this route, not a capacity claim. These values describe the DEFAULT
# profile (space-bunny-free); p1 does not lower the window per selected profile, so selecting
# mimo-v2.6-flash-free (200k context) here keeps this 1M window.
[context]
window_tokens = 1048576
output_headroom_tokens = 524288
summarize_at_tokens = 450000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
