route   = "anthropic-subscription"
profile = "claude-sonnet-5"

[options]
reasoning_effort = "medium"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "worker_start"
[[tools]]
module = "worker_result"
[[tools]]
module = "worker_continue"
[[tools]]
module = "worker_cancel"

[[tools]]
module = "finish"

# Operational values, not a capacity claim: no vendor documents a context window for this
# subscription endpoint (research #27), and no p1 run has proven a request size on it yet.
# 200k is deliberately conservative — a too-small window only summarizes earlier, a too-large one
# fails the request. Summarize late enough for multi-file work (a tight threshold thrashes: run
# split4a-deepseek, docs/dogfood/runs.jsonl), keep a long tail. Raise only on evidence from
# several runs, never from one run's peak.
[context]
window_tokens = 200000
output_headroom_tokens = 32000
summarize_at_tokens = 120000
keep_recent_tokens = 40000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
