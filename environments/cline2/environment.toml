route   = "cline-pass-2"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "finish"

# Same as environments/cline (the owner's second ClinePass account): the 1M window is a MODEL-level
# value, not measured on this route. ClinePass documents no context window
# (docs.cline.bot/getting-started/clinepass, fetched 2026-09-24) and the model's vendor states 1M
# (api-docs.deepseek.com "CONTEXT LENGTH 1M"); the OpenCode Go gateway metadata agrees (context
# 1000000, output 384000). Summarize at 300k as in environments/deepseek; keep a long tail.
[context]
window_tokens = 1000000
output_headroom_tokens = 32000
summarize_at_tokens = 300000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
