# A leaf environment for read-only review and report tasks (ADR-0124, issue #424): the
# deepseek route and profile with a review prompt, the reading tools, `write` for the report,
# and no worker or workflow tools.
route   = "opencode-go-subscription"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"

[capabilities]
workers = false
workflows = false

[[tools]]
module = "read"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "read_output"
[[tools]]
module = "write"
[[tools]]
module = "finish"

# [context]: the same values as environments/deepseek, for the same route and model; the
# sources and reasoning are in that file.
[context]
window_tokens = 1000000
output_headroom_tokens = 96000
summarize_at_tokens = 300000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
