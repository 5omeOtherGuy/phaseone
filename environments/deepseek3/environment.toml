route   = "opencode-go-messages-3"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"
max_output_tokens = 256000

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "shell_job"
[[tools]]
module = "read_output"
[[tools]]
