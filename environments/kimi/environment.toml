route   = "kimi-coding-subscription"
profile = "kimi-k3"

[options]
reasoning_effort = "high"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "finish"

# Vendor-documented, but TIER-DEPENDENT (www.kimi.com/code/docs/en/kimi-code/models.html, fetched
# 2026-09-24): the coding plan's `k3` model has "Context window 1048576 (for higher-tier members)"
# and "on a Moderato / Plus plan, k3 supports up to 256K context; up to 1M context is available on
# Allegretto / Pro or above" (`k3-256k` is fixed at 262144). The owner's plan tier is not part of
# this configuration, so the documented FLOOR (262144) is used and the environment stays one model
# on every tier; raise to 1048576 once the tier is known (docs/design/context-windows.md).
# Summarize at 150k = 60% of the floor (157,286) rounded down to 10k, keeping a long tail.
# The reserve is 32,000: LEAD POLICY (2026-09-25). The same source gives this model up to 131,072
# output tokens and no per-response measurement exists here, so 32,000 is a policy choice below
# that ceiling; it bounds the wall at 230,144, and summarizing at 150,000 leaves 80,144 for one
# response — a response above that is possible and would hit the window. ACCEPTED RISK, to be
# revisited with per-response telemetry (deferred follow-up, docs/design/context-windows.md).
[context]
window_tokens = 262144
output_headroom_tokens = 32000
summarize_at_tokens = 150000
keep_recent_tokens = 50000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
