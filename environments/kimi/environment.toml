route   = "kimi-coding-subscription"
profile = "kimi-k3"

[options]
reasoning_effort = "high"
# Every agent turn carries an explicit output cap equal to the reserve (ADR-0143, #645 R5):
# Kimi Code always sends max_completion_tokens, and the Kimi Open Platform docs give K3 an
# output default of 131,072 (profiles/kimi-k3.toml max_output_tokens).
max_output_tokens = 131072

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "shell_job"
[[tools]]
module = "read_output"
[[tools]]
module = "ask_user_question"
[[tools]]
module = "finish"

# The 1M tier (ADR-0143, #645 R6). Window: live `GET /coding/v1/models` reports k3
# `context_length` 1048576; the vendor gives 1M only to Allegretto / Pro and above, and 256K on
# Moderato / Plus (www.kimi.com/code/docs/en/kimi-code/models.html). The account's tier was
# measured on 2026-10-09: a 274,765-token `k3` prompt returned HTTP 200, above the 262,144 that a
# Moderato / Plus account refuses with 401, so this account has the 1M tier.
# Reserve = the output cap above (131,072). ADR-0136 rule: summarize and trim together at
# min(0.8W, W - output - 65536) = min(838,860, 851,968) = 838,860 (0.8W floored); wall 917,504.
# Kimi Code's own compaction point max(0.85W, W - 50,000) keeps no output reserve: not adopted.
[context]
window_tokens = 1048576
output_headroom_tokens = 131072
summarize_at_tokens = 838860
trim_at_tokens = 838860
keep_recent_tokens = 50000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
