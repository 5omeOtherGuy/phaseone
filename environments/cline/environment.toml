route   = "cline-pass"
profile = "deepseek-v4.1-flash"
# The route's default account until the connector routes carried their own credential (#852).
account = "cline-pass-1"

[options]
reasoning_effort = "high"
max_output_tokens = 256000

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "shell_job"
[[tools]]
module = "read_output"
[[tools]]
module = "ask_user_question"

[[tools]]
module = "worker_start"
[[tools]]
module = "worker_result"
[[tools]]
module = "worker_continue"
[[tools]]
module = "worker_cancel"
[[tools]]
module = "workflow_start"
[[tools]]
module = "workflow_status"
[[tools]]
module = "workflow_result"
[[tools]]
module = "workflow_cancel"

# Same model policy as environments/deepseek (ADR-0136). The 1M capacity is
# DeepSeek's documented model value, not a measured ClinePass route limit.
[context]
window_tokens = 1000000
output_headroom_tokens = 256000
summarize_at_tokens = 678464
trim_at_tokens = 678464
keep_recent_tokens = 119040
user_verbatim_tokens = 8000
summary_output_tokens = 65536
