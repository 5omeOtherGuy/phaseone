route   = "cline-pass-1"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "finish"

# The route serves a 1M-token window. The first values here (170k window, summarize at 90k) were
# taken from one run's peak and were far too tight: run split4a (docs/dogfood/runs.jsonl) read
# 698 files in 855 requests, was summarized 40 times and never reached its first edit — a task
# that must hold several large files at once thrashes below ~100k. Summarize late, keep a long tail.
[context]
window_tokens = 1000000
output_headroom_tokens = 32000
summarize_at_tokens = 300000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
