route   = "opencode-go-subscription"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"
max_output_tokens = 256000

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "shell_job"
[[tools]]
module = "read_output"
[[tools]]
module = "ask_user_question"
[[tools]]
module = "finish"

# DeepSeek documents a 1M window; dsh defaults to 256000 output tokens (ADR-0136).
# Compact at min(0.8W, W - output - 65536) = 678464; keep 16% of usable input.
# Trim only under that same compaction pressure, preserving the prefix below it.
[context]
window_tokens = 1000000
output_headroom_tokens = 256000
summarize_at_tokens = 678464
trim_at_tokens = 678464
keep_recent_tokens = 119040
user_verbatim_tokens = 8000
summary_output_tokens = 65536
