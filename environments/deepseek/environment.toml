route   = "opencode-go-subscription"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "finish"

# The route serves a 1M-token window. Sources (2026-09-24): the gateway's own model metadata
# (models.dev/api.json, provider `opencode-go`, model `deepseek-v4.1-flash`: context 1000000,
# output 384000) and the vendor (api-docs.deepseek.com: "CONTEXT LENGTH 1M"). The first values
# here (170k window, summarize at 90k) were taken from one run's peak and were far too tight: run
# split4a (docs/dogfood/runs.jsonl) read 698 files in 855 requests, was summarized 40 times and
# never reached its first edit — a task that must hold several large files at once thrashes below
# ~100k. Summarize at 300k: no source argues for another point, and the 60% rule would cap at 500k
# with no measured evidence for it (docs/design/context-windows.md). The reserve is 96,000: LEAD
# POLICY (2026-09-25), not a measurement. The route allows up to 384,000 output per response
# (gateway metadata above), and no per-response usage has been measured here — the reasoning and
# output totals of run split4a2-deepseek (71,337 and 141,126, docs/dogfood/runs.jsonl) are sums
# over that run's 235 requests, so they cannot size one response. The reserve is therefore a policy
# choice below the 384,000 ceiling; with the wall at 904,000 and the threshold at 300,000 there are
# 604,000 tokens of room, so it cannot bind before summarization. Keep a long tail.
[context]
window_tokens = 1000000
output_headroom_tokens = 96000
summarize_at_tokens = 300000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
