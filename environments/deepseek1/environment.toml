route   = "opencode-go-1-subscription"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "finish"

# Copied from environments/deepseek, not measured on this route: the runs behind these values
# (split4a and its successors, docs/dogfood/runs.jsonl) ran on another OpenCode Go account. The 1M
# window is what the model's vendor states for its own API; OpenCode Go documents no window for
# this endpoint (research #27). That account is out of credit (2026-09-23); the values stay so an
# existing brief that names it keeps the behaviour it had. Summarize late, keep a long tail.
[context]
window_tokens = 1000000
output_headroom_tokens = 32000
summarize_at_tokens = 300000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
