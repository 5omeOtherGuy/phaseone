# The core environment (ADR-0197, ADR-0217): what a bare `p1` runs. The public Anthropic API with
# an API key (`ANTHROPIC_API_KEY`) and Claude Sonnet 5; everything else is the `claude` kit's
# (kits/claude, over kits/base). It names its route because two Anthropic routes bind its model.
# A user picks another environment with `default_environment` in settings.toml.
model = "claude-sonnet-5"
route = "anthropic"
