# The core environment (ADR-0197): what a bare `p1` runs without any subscription. The public
# Anthropic API with an API key (`ANTHROPIC_API_KEY`), Claude Sonnet 5, p1's standard tools and
# a prompt composed from the generic fragments of environments/prompts/fragments. A user picks
# another environment with `default_environment` in settings.toml.
route   = "anthropic"
profile = "claude-sonnet-5"

[instructions]
files = ["AGENTS.md", "CLAUDE.md"]

[skills]
roots = [".agents/skills", ".claude/skills"]

[options]
reasoning_effort = "medium"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "shell_job"
[[tools]]
module = "read_output"
[[tools]]
module = "ask_user_question"

[[tools]]
module = "worker_start"
[[tools]]
module = "worker_result"
[[tools]]
module = "worker_continue"
[[tools]]
module = "worker_cancel"
[[tools]]
module = "workflow_start"
[[tools]]
module = "workflow_status"
[[tools]]
module = "workflow_result"
[[tools]]
module = "workflow_cancel"

[[tools]]
module = "todo_write"

[[tools]]
module = "skill"

# ADR-0118: up to 10 read-only tools at once and every shell call alone, the values the
# `claude` environment takes from Claude Code's documented default.
[tool_concurrency]
max_parallel = 10
shell_reads  = false

# Claude Sonnet 5 has a 1M-token window by default on the Claude API ("1M tokens for Claude
# Sonnet 5 and Claude Sonnet 4.6", docs.anthropic.com context-windows). Details:
# docs/design/context-windows.md.
[context]
window_tokens = 1000000
output_headroom_tokens = 32000
summarize_at_tokens = 500000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
