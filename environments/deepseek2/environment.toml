route   = "opencode-go-2-subscription"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "finish"

# Same endpoint and model as environments/deepseek, the owner's second OpenCode Go account. Sources
# (2026-09-24): gateway metadata (models.dev/api.json, provider `opencode-go`,
# `deepseek-v4.1-flash`: context 1000000, output 384000) and the vendor api-docs.deepseek.com
# ("CONTEXT LENGTH 1M"); 300k stays for the reason recorded in environments/deepseek. Summarize
# late, keep a long tail — a task that must hold several large files at once thrashes below ~100k.
[context]
window_tokens = 1000000
output_headroom_tokens = 32000
summarize_at_tokens = 300000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
