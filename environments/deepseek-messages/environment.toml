route = "opencode-go-messages"
profile = "deepseek-v4.1-flash"

[options]
reasoning_effort = "high"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "shell_job"
[[tools]]
module = "read_output"
[[tools]]
module = "ask_user_question"
[[tools]]
module = "finish"

# Kept equal to deepseek; no switch of an existing environment.
[context]
window_tokens = 1000000
output_headroom_tokens = 96000
summarize_at_tokens = 300000
trim_at_tokens = 150000
keep_recent_tokens = 60000
user_verbatim_tokens = 8000
summary_output_tokens = 12000
