# The base kit (ADR-0217): every table a family kit leaves out, and the whole kit of a family
# without one (`space-bunny`, `mimo`, `muse-free`). A table is taken whole, never merged; a
# kit or environment that carries one replaces this one, and the keys it leaves out take their
# defaults. Filled from the shipped `default` environment of b98a8167.

