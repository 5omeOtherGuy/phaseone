# The GPT kit (family `gpt`, ADR-0217): the Codex CLI's tool set as GPT models were tuned on it
# (ADR-0218), the GPT prompt and the compaction preferences of the owner's `gpt` environment of
# b98a8167. With the `openai` connector it is the "ChatGPT bundle".

prompt_file = "prompt.md"

# The tool set is exactly the Codex set below: a leaf, so the host appends no worker or
# workflow tools to a main agent on this kit (ADR-0124, ADR-0218).
[capabilities]
workers = false
workflows = false

[options]
reasoning_effort = "medium"

[instructions]
files = ["AGENTS.override.md", "AGENTS.md"]
max_bytes = 32768

# The compaction preferences, no window: what a route serves of a GPT model is wire data. The
# Codex subscription serves 272,000 (codex-rs models.json, 2026-09-24), which its route binds as
# `context_limit` (connectors/openai/routes/openai-codex-subscription.toml); a route that states
# no window and a profile that states none leave the window unknown, and the context refuses to
# start. Summarize at 220,000, below Codex's own 244,800 (90% of the window). The reserve is
# 32,000, a lead policy of 2026-09-25: reasoning counts as output and one reasoning-heavy turn
# can exceed Codex's own 5%; the reserve bounds the wall at 240,000, so summarizing at 220,000
# leaves 52,000 for one response, an accepted risk until per-response telemetry exists
# (docs/design/context-windows.md).
[context]
output_headroom_tokens = 32000
summarize_at_tokens = 220000
keep_recent_tokens = 40000
user_verbatim_tokens = 8000
summary_output_tokens = 12000

# Codex's default Direct set (openai/codex rust-v0.162.1) as p1 carries it, under Codex's
# names, schemas and result text (ADR-0218, docs/design/tools.md "The Codex faces"):
# `exec_command` and `write_stdin` over the shell's process capability and the session's
# jobs, `apply_patch` as Codex's freeform tool, `request_user_input` over the user-questions
# capability. `update_plan` ships too and, as in Codex, is off unless an environment lists it.
[[tools]]
module = "exec_command"
[[tools]]
module = "write_stdin"
[[tools]]
module = "codex_apply_patch"
[[tools]]
module = "request_user_input"
