<!-- @dsCard group="Glyphs" viewport="700x110" subtitle="Eight glyphs, each with a fixed hue partner" name="Glyph → state" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--h-ground);color:var(--h-ink);font-family:var(--font-mono);font-size:12px;line-height:1.5;}</style></head>
<body><div style="padding:16px;"><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:#1a1a1a;"><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-attn)">›</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">prompt</div></div><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-dim)">▸</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">call</div></div><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-live)">▸</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">running</div></div><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-ok)">✓</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">done</div></div><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-fail)">✗</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">failed</div></div><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-attn)">!</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">blocking</div></div><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-ref)">↳</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">activity</div></div><div style="background:var(--h-block);padding:10px;"><div style="font-size:20px;color:var(--slab-live)">▪</div><div style="font-size:10px;color:var(--h-dim);margin-top:4px;">worker</div></div></div></div></body></html>
