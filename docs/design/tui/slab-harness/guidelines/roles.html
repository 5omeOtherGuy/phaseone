<!-- @dsCard group="Colors" viewport="700x180" subtitle="What gets hue in a tool block" name="Transcript roles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--h-ground);color:var(--h-ink);font-family:var(--font-mono);font-size:12px;line-height:1.5;}</style></head>
<body><div style="padding:16px;"><div style="display:grid;gap:6px;"><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">DIM</span><span style="color:var(--h-dim)">▸ tool name, body text, outcome facts</span></div><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">INK</span><span style="color:var(--h-ink)">argument, values, decision labels</span></div><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">REF</span><span style="color:var(--slab-ref)">↳ paths, file:line, fold targets</span></div><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">OK</span><span style="color:var(--slab-ok)">✓ outcome glyph, +A</span></div><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">FAIL</span><span style="color:var(--slab-fail)">✗ outcome glyph, −B</span></div><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">LIVE</span><span style="color:var(--slab-live)">▸ running glyph, ▪▪▪ working</span></div><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">ATTN</span><span style="color:var(--slab-attn)">! blocking header, decision chips, › prompt</span></div><div style="display:grid;grid-template-columns:60px 1fr;"><span style="color:var(--h-dim);font-size:10px;">FAINT</span><span style="color:var(--h-faint)">line numbers, fold meta, key hints</span></div></div></div></body></html>
