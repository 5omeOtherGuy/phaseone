# Builds the package with the toolchain p1 pins, runs p1's author conformance checks on it and
# keeps the archive; a tag `v*` publishes it as a release asset with its digest.
name: module

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the Rust and the wasm target; wasm-tools is the SDK's pin
      # (modules/toolchain.pins of the phaseone tag the SDK dependency names).
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.259.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: module-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: ./build.sh
      - run: ./conformance.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: target/p1-module/*.p1pkg
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/p1-module
          sha256sum ./*.p1pkg > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file SHA256SUMS ./*.p1pkg SHA256SUMS
