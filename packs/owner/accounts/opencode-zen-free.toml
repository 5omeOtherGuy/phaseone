# OpenCode Zen account free: free models only; no usage endpoint is known (docs/design/usage.md).
# Converted from per-account route files (ADR-0139 §9): `store_id`, `env` and the
# `[legacy_*]` tables keep every store entry, variable, route id and session origin as before.
id       = "opencode-zen-free"
label    = "opencode zen free"
origins  = ["https://opencode.ai"]

[credential]
# A reference, never a value. This account's key is its own store entry; it is not
# `OPENCODE_API_KEY` (the Go account's variable) nor any other Zen account's.
method     = "api-key"
env        = "OPENCODE_ZEN_API_KEY"
borrow     = []
store_only = true

[legacy_routes]
"opencode-zen-free" = "opencode-zen"

[legacy_origins]
"opencode-zen" = "openai-chat/opencode-zen-free"
