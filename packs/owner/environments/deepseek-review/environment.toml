# A leaf environment for read-only review and report tasks (ADR-0124, issue #424): the
# deepseek route and profile with a review prompt, the reading tools, `write` for the report,
# and no worker or workflow tools.
route   = "opencode-go-messages"
profile = "deepseek-v4.1-flash"
# The route's default account until the connector routes carried their own credential (#852).
account = "opencode-go"

[capabilities]
workers = false
workflows = false

[[tools]]
module = "read"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "read_output"
[[tools]]
module = "write"
