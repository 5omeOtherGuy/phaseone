# Claude on the Claude Code subscription (ADR-0217): the `claude` kit, with the owner's prompt,
# standing-instruction order and skill roots.
model   = "claude-sonnet-5"
route   = "anthropic-subscription"
# The route's default account until the connector routes carried their own credential (#852).
account = "claude"

[instructions]
files = ["CLAUDE.md", "AGENTS.md"]

[skills]
roots = ["~/.claude/skills", ".claude/skills", "~/.agents/skills", ".agents/skills"]
