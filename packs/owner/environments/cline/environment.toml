# DeepSeek V4.1 Flash on ClinePass (ADR-0217): the `deepseek` kit with a narrower tool set (no
# `todo_write`, no `skill`).
model   = "deepseek-v4.1-flash"
route   = "cline-pass"
# The route's default account until the connector routes carried their own credential (#852).
account = "cline-pass-1"

[[tools]]
module = "read"
[[tools]]
module = "edit"
[[tools]]
module = "write"
[[tools]]
module = "grep"
[[tools]]
module = "shell"
[[tools]]
module = "shell_job"
[[tools]]
module = "read_output"
[[tools]]
module = "ask_user_question"
[[tools]]
module = "worker_start"
[[tools]]
module = "worker_result"
[[tools]]
module = "worker_continue"
[[tools]]
module = "worker_cancel"
[[tools]]
module = "workflow_start"
[[tools]]
module = "workflow_status"
[[tools]]
module = "workflow_result"
[[tools]]
module = "workflow_cancel"
