# The connectors' guest workspace (ADR-0214): the crates and module packages the subscription
# connectors build with the module SDK, as a module author outside phaseone would.
#
# Separate from phaseone's root workspace, like modules/: a component crate is built for the
# wasm target only, and nothing in the core depends on any of this. The connectors depend on
# phaseone only through `p1-module-sdk`, pinned once below. The host-side suites
# (subscriptions/tests) are a member of the root workspace instead: they drive these crates
# natively through p1's host crates.
[workspace]
resolver = "3"
members = ["subscriptions/logins", "subscriptions/usage", "subscriptions/components/*"]
exclude = ["subscriptions/tests"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# The one place the connectors name phaseone. In phaseone the SDK is the sibling checkout's;
# a connectors repository of its own pins the tag instead:
#   p1-module-sdk = { git = "https://github.com/5omeOtherGuy/phaseone", tag = "module-sdk-v1.2.0" }
p1-module-sdk = { path = "../modules/sdk" }
serde_json = "1"

# The release profile the component build uses, as in modules/: a guest panic is the wasm
# `unreachable` trap, and the size options keep a component small.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
