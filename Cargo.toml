[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/p1-hook-shadow",
    "crates/p1-tool-read/guest",
    "crates/p1-tool-shell/guest",
    "crates/p1-tool-finish/guest",
    "crates/p1-tool-edit/logic",
    "crates/p1-tool-patch/logic",
    "crates/p1-tool-search/logic",
    "crates/p1-tool-write/logic",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
