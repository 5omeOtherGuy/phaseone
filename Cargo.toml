[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/p1-hook-shadow",
    "crates/p1-tool-read/guest",
    "crates/p1-tool-read-output/guest",
    "crates/p1-tool-question/guest",
    "crates/p1-tool-shell/guest",
    "crates/p1-tool-shell-job/guest",
    "crates/p1-tool-finish/guest",
    "crates/p1-tool-todo/guest",
    "crates/p1-tool-edit/logic",
    "crates/p1-tool-patch/logic",
    "crates/p1-tool-search/logic",
    "crates/p1-tool-write/logic",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

# The exhaustive prompt acceptance sweep renders every subset of shipped tools.
# Optimise its string processing and harness without reducing that coverage.
[profile.dev.package.p1-assembly]
opt-level = 3

# Provider conformance constructs a fresh component instance at every fixture byte
# split. Optimize the host-side component machinery too, retaining that full sweep.
[profile.dev.package.p1-module-runtime]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 1

# Test builds compile every loaded component from its bytes (no compiled cache,
# p1-module-runtime loader.rs), so an unoptimised Cranelift makes each p1 process
# start slowly. Optimising the compiler crates keeps debug builds usable.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
