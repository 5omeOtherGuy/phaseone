# How the ChatGPT/Codex subscription is reached (ADR-0039 step 4, spec §7.2 of
# docs/design/routes-and-profiles.md). Everything the host used to compile for this
# route lives here. `origin_route` is byte for byte the `Origin.route` the responses
# adapter wrote before route data existed, so a session recorded then still resumes
# (ADR-0033). The account's wire is declared below (ADR-0214): the `/codex/responses` path, the
# ChatGPT account-id header, no output-cap field, the Codex client's `originator` and SSE beta,
# and the cache key as the session/conversation headers; the `store: false` body and the
# protocol's own headers are the adapter's.
id           = "openai-codex-subscription"
origin_route = "openai-responses/codex-subscription"
adapter      = "openai-responses"
endpoint     = "https://chatgpt.com/backend-api"

[credential]
# A reference, never a value. `store_only` (ADR-0061) keeps this route
# self-contained: the chain is p1's own store alone, and the Codex CLI auth file is
# never read. Drop the field to restore the legacy borrow-the-CLI chain.
kind       = "codex-oauth"
store_only = true

[adapter_settings]
# ADR-0047 §1, owner decision 2026-09-21: WebSocket is the default; §5 falls back to SSE.
transport = "websocket"

# The ChatGPT/Codex subscription's dialect: a credential without the account id is an
# authentication failure, and an explicit output cap is refused rather than ignored.
[adapter_settings.dialect]
name              = "codex-subscription"
path              = "/codex/responses"
account_id_header = "chatgpt-account-id"
output_cap        = false
client_headers    = [["originator", "p1"]]
beta              = "responses=experimental"
session_headers   = ["session_id", "conversation_id"]

# Only profiles the host ships a policy for; any other profile is refused. A dated
# snapshot is a binding (`wire_model`), not a profile. `context_limit` is the window this
# subscription serves (ADR-0217): 272,000, from the Codex CLI's own model metadata for this
# account (github.com/openai/codex, codex-rs/models-manager/models.json at main cf792c3a,
# 2026-09-24: "context_window": 272000, "max_context_window": 872000), where the public API
# serves the same models 1,050,000. 872,000 is not used: no model this route binds enables
# experimental context, and overstating a window fails the request.
[models."gpt-6-astra"]
wire_model = "gpt-6-astra"
context_limit = 272000
[models."gpt-6-sol"]
wire_model = "gpt-6-sol"
context_limit = 272000
[models."gpt-6-luna"]
wire_model = "gpt-6-luna"
context_limit = 272000
[models."gpt-5.6-sol"]
wire_model = "gpt-5.6-sol"
context_limit = 272000
[models."gpt-5.6-terra"]
wire_model = "gpt-5.6-terra"
context_limit = 272000
[models."gpt-5.6-luna"]
wire_model = "gpt-5.6-luna"
context_limit = 272000
[models."gpt-5.5"]
wire_model = "gpt-5.5"
context_limit = 272000
