# ZCode's native Coding Plan wire (ADR-0147). The adapter appends /v1/messages.
id           = "glm-messages"
origin_route = "anthropic-messages/glm-messages"
adapter      = "anthropic-messages"
endpoint     = "https://api.z.ai/api/anthropic"
# The Z.ai key of `glm-subscription` (same origin): its store entry and variable (ADR-0134).
credential_route = "glm-subscription"

[credential]
method     = "api-key"
env        = "ZAI_API_KEY"
store_only = true

[adapter_settings]
dialect = "zai"
credential_header = "x-api-key"

[models."glm-5.3"]
wire_model = "glm-5.3"

[models."glm-5.3-flash"]
wire_model = "glm-5.3-flash"
