[package]
name = "p1-connector-usage-glm"
description = "A usage-probe component (ADR-0214): the Z.ai GLM coding plan usage endpoint and its response, over the subscription connectors' usage probes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

# Built with the guest SDK, pinned once in connectors/Cargo.toml (ADR-0210, ADR-0214); the
# decoding is the connectors' own crate, compiled in by path.
[dependencies]
p1-module-sdk = { workspace = true, features = ["usage-probe"] }
p1-subscription-usage = { path = "../../usage" }

# The frozen package manifest (docs/design/modules/package.md). A usage probe imports nothing
# (its allocation is empty) and names the https origin its request goes to, which receives
# the account's credential.
[package.metadata.p1-module]
name = "connectors/glm"
kind = "usage-probe"
world = "p1:module/usage-probe@1.2.0"
protocol = "1.0"
capabilities = []
variant = "default"
token_origins = ["https://api.z.ai"]
