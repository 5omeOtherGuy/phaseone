[package]
name = "p1-subscriptions-tests"
description = "The subscription connectors' own checks (ADR-0200): their route files, read by path from connectors/subscriptions, composed and conformed through the host (test-only crate; nothing depends on it)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# The connectors' code in the host (ADR-0200); the suites need it, so a build without it
# compiles none of them.
default = ["subscriptions"]
subscriptions = ["p1-host/subscriptions"]

[dependencies]
p1-host = { path = "../../../crates/p1-host" }

# The suites share p1-host's test harness (`crates/p1-host/tests/common` and `native_routes`,
# included by path), so they take the same dependencies.
[dev-dependencies]
p1-assembly = { path = "../../../crates/p1-assembly" }
p1-auth = { path = "../../../crates/p1-auth" }
p1-contracts = { path = "../../../crates/p1-contracts" }
p1-core = { path = "../../../crates/p1-core" }
p1-journal = { path = "../../../crates/p1-journal" }
p1-model-profile = { path = "../../../crates/p1-model-profile" }
p1-module-tests = { path = "../../../crates/p1-module-tests" }
p1-provider-anthropic = { path = "../../../crates/p1-provider-anthropic" }
p1-provider-conformance = { path = "../../../crates/p1-provider-conformance" }
p1-provider-http = { path = "../../../crates/p1-provider-http", features = ["testing"] }
p1-provider-openai = { path = "../../../crates/p1-provider-openai" }
p1-provider-openai-chat = { path = "../../../crates/p1-provider-openai-chat" }
p1-testkit = { path = "../../../crates/p1-testkit" }
futures-util = "0.3"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "signal",
    "io-util",
    "io-std",
    "sync",
    "time",
    "test-util",
] }

[[test]]
name = "anthropic_route"
required-features = ["subscriptions"]

[[test]]
name = "openai_route"
required-features = ["subscriptions"]

[[test]]
name = "route_files"
required-features = ["subscriptions"]

[[test]]
name = "store_only"
required-features = ["subscriptions"]
