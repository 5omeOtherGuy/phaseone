# The Messages wire for every OpenCode Go account (ADR-0138, ADR-0139 §9). Its own credential is
# the key of `opencode-go-subscription` (ADR-0134); further Go accounts are account files.
id = "opencode-go-messages"
origin_route = "anthropic-messages/opencode-go-messages"
adapter = "anthropic-messages"
endpoint = "https://opencode.ai/zen/go"
retry_policy = "deepseek"
credential_route = "opencode-go-subscription"

[credential]
method     = "api-key"
env        = "OPENCODE_API_KEY"
store_only = true

[adapter_settings]
dialect = "opencode-go"
credential_header = "x-api-key"

# Owner rule (2026-09-20): an OpenCode Go account serves DeepSeek V4.1 Flash ONLY — bind no other
# profile. The rule covers every account in accounts/opencode-go*.toml. One exception, owner
# 2026-10-10 (#707): GLM 5.3 on its own route, routes/opencode-go-glm.toml.
[models."deepseek-v4.1-flash"]
wire_model = "deepseek-v4.1-flash"
