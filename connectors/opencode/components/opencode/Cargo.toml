[package]
name = "p1-connector-opencode"
description = "A credential component (ADR-0212): the OpenCode CLI's keyed login, borrowed by API-key routes, over the subscription connectors' login formats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

# Built with the guest SDK, pinned once in connectors/Cargo.toml (ADR-0210, ADR-0214); the login
# format is the connectors' own crate, compiled in by path.
[dependencies]
p1-module-sdk = { workspace = true, features = ["credential-method"] }
p1-connector-logins = { path = "../../../shared/logins" }

# The frozen package manifest (docs/design/modules/package.md). A credential method imports
# nothing (its allocation is empty) and names the https origins its refresh may go to.
[package.metadata.p1-module]
name = "connectors/opencode"
kind = "credential-method"
world = "p1:module/credential-method@1.2.0"
protocol = "1.0"
capabilities = []
variant = "default"
token_origins = []
