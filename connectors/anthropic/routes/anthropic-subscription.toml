# How the Claude Code subscription is reached (ADR-0039 step 4, spec §7.2 of
# docs/design/routes-and-profiles.md). Everything the host used to compile for this
# route lives here. `origin_route` is byte for byte the `Origin.route` the messages
# adapter wrote before route data existed, so a session recorded then still resumes
# (ADR-0033). The account's wire is declared below (ADR-0214): the Claude Code identity block
# first in `system`, the OAuth betas and the CLI's client headers, with the OAuth bearer alone
# (no `x-api-key`); the `/v1/messages` path and the protocol's own headers are the adapter's.
id           = "anthropic-subscription"
origin_route = "anthropic-messages/claude-subscription"
adapter      = "anthropic-messages"
endpoint     = "https://api.anthropic.com"

# The route's own account (ADR-0139 §6, ADR-0200): p1's store entry under this route id, read
# from the store only. A second Claude login is an account file of its own.
[credential]
method     = "claude-code-oauth"
store_only = true

[adapter_settings]
# Owner hotfix 2026-09-25: request the native 1M-token window (the context-1m beta) on this
# subscription; the owner confirmed the account serves it.
long_context = true

# The Claude Code subscription's dialect: without the identity block the account rejects the
# request; it is wire behaviour, not part of any prompt file.
[adapter_settings.dialect]
name           = "claude-code-subscription"
claude         = true
identity       = "You are Claude Code, Anthropic's official CLI for Claude."
betas          = ["oauth-2025-04-20", "claude-code-20250219"]
client_headers = [
    ["anthropic-dangerous-direct-browser-access", "true"],
    ["x-app", "cli"],
]

# Only profiles the host ships a policy for; any other profile is refused. A dated
# snapshot is a binding (`wire_model`), not a profile.
[models."claude-fable-5"]
wire_model = "claude-fable-5"
[models."claude-opus-4-6"]
wire_model = "claude-opus-4-6"
[models."claude-opus-5"]
wire_model = "claude-opus-5"
[models."claude-opus-5-5"]
wire_model = "claude-opus-5-5"
[models."claude-sonnet-4-6"]
wire_model = "claude-sonnet-4-6"
[models."claude-sonnet-5"]
wire_model = "claude-sonnet-5"
