# OpenCode Go account 1.
# Converted from per-account route files (ADR-0139 §9): `store_id`, `env` and the
# `[legacy_*]` tables keep every store entry, variable, route id and session origin as before.
id       = "opencode-go-1"
label    = "opencode go-1"
origins  = ["https://opencode.ai"]
store_id = "opencode-go-1-subscription"
usage    = "opencode-go"

[credential]
# A reference, never a value.
method     = "api-key"
env        = "OPENCODE_GO_1_API_KEY"
borrow     = []
store_only = true

[legacy_routes]
"opencode-go-1-subscription" = "opencode-go-subscription"
"opencode-go-messages-1" = "opencode-go-messages"

[legacy_origins]
"opencode-go-messages" = "anthropic-messages/opencode-go-messages-1"
"opencode-go-subscription" = "openai-chat/opencode-go-1-subscription"
