# The owner's SECOND OpenCode Go subscription (2026-09-20, when the first ran out of credit).
# The key is not in any CLI login store: the operator supplies it through p1's own store or the
# environment variable (e.g. from ~/.config/keys/); p1 never reads that file itself.
# Owner rule (2026-09-20, carried to this account): an OpenCode Go account serves DeepSeek V4.1
# Flash ONLY — bind no other profile.
# Converted from per-account route files (ADR-0139 §9): `store_id`, `env` and the
# `[legacy_*]` tables keep every store entry, variable, route id and session origin as before.
id       = "opencode-go-2"
label    = "opencode go-2"
origins  = ["https://opencode.ai"]
store_id = "opencode-go-2-subscription"
usage    = "opencode-go"

[credential]
# A reference, never a value.
method     = "api-key"
env        = "OPENCODE_GO_2_API_KEY"
borrow     = []
store_only = true

[legacy_routes]
"opencode-go-2-subscription" = "opencode-go-subscription"
"opencode-go-messages-2" = "opencode-go-messages"

[legacy_origins]
"opencode-go-messages" = "anthropic-messages/opencode-go-messages-2"
"opencode-go-subscription" = "openai-chat/opencode-go-2-subscription"
