# The first Claude Code subscription (ADR-0074).
# Converted from per-account route files (ADR-0139 §9): `store_id`, `env` and the
# `[legacy_*]` tables keep every store entry, variable, route id and session origin as before.
id       = "claude"
label    = "claude max"
origins  = ["https://api.anthropic.com"]
store_id = "anthropic-subscription"
usage    = "claude"

[credential]
# A reference, never a value.
method     = "claude-code-oauth"
store_only = true

[legacy_origins]
"anthropic-subscription" = "anthropic-messages/claude-subscription"
